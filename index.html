<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pointages SNCFT</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;
  background:#eef2f7;font:16px system-ui,sans-serif;color:#16222f}
.msg{text-align:center;padding:20px}
.msg h1{font-size:20px;margin:0 0 10px}
.msg a{color:#2e6fae}
.spin{width:24px;height:24px;border:3px solid #d3dbe6;border-top-color:#2e6fae;
  border-radius:50%;margin:0 auto 16px;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
</style></head><body>
<div class="msg">
  <div class="spin"></div>
  <h1>Ouverture du dernier pointage…</h1>
  <p>Si rien ne se passe, <a href="tous-les-mois.html">cliquez ici</a>.</p>
</div>
<script>
fetch('mois.json', {cache:'no-store'})
  .then(r => r.ok ? r.json() : null)
  .then(d => {
    if (d && Array.isArray(d.months) && d.months.length > 0) {
      const s = d.months.slice().sort((a,b) =>
        (a.year - b.year) || (a.monthNum - b.monthNum));
      window.location.replace(s[s.length - 1].file);
    } else {
      window.location.replace('tous-les-mois.html');
    }
  })
  .catch(() => { window.location.replace('tous-les-mois.html'); });
</script>
</body></html>
