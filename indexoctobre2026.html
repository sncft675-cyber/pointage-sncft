<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pointage Régulation et PC</title>
<link rel="icon" id="favicon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#eef2f7; --surface:#ffffff; --fg:#16222f; --muted:#5d6b7b; --line:#d3dbe6;
  --accent:#2e6fae; --accent-fg:#ffffff;
  --head:#3579bd;
  --head-fg:#ffffff;
  --x-w:#ffffff; --x-g:#f2f2f2; --x-G:#d9d9d9; --x-b:#daeef3;
  --x-p:#e4dfec; --x-v:#ebf1de; --x-O:#fbcda7;
  --x-V:#f4cccc; --x-FOR:#ffe599;
  --hl:#e74c3c;
  --hl-tint:rgba(46,111,174,0.20);
  --font-d:'Barlow Condensed','Arial Narrow',sans-serif;
  --font-b:'IBM Plex Sans',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f2036; --surface:#173250; --fg:#e8eef6; --muted:#9db3ca; --line:#2f4d70;
  --accent:#7dbbf0; --accent-fg:#0b1a28;
  --head:#1e5a9e; --head-fg:#ffffff;
  --hl:#ff8e7a;
  --hl-tint:rgba(125,187,240,0.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f2036; --surface:#173250; --fg:#e8eef6; --muted:#9db3ca; --line:#2f4d70;
  --accent:#7dbbf0; --accent-fg:#0b1a28;
  --head:#1e5a9e; --head-fg:#ffffff;
  --hl:#ff8e7a;
  --hl-tint:rgba(125,187,240,0.25);
  color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.4 var(--font-b);font-family:var(--font-b)}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:0 40px}

header{background:var(--head);color:var(--head-fg);margin-inline:-16px;
  padding:18px 16px 0;position:sticky;top:0;z-index:5}
.top-row{display:flex;align-items:center;gap:16px;margin-bottom:8px;min-height:64px}
.logo{flex:none;height:64px;width:auto;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.30));pointer-events:none}
.top-row .org{flex:1;min-width:0;
  font:600 12px/1.35 var(--font-b);letter-spacing:.1em;
  text-transform:uppercase;opacity:.95}
header:not(.has-logo) .top-row{justify-content:center;text-align:center}
header:not(.has-logo) .top-row .org{text-align:center}
header h1{font:700 24px/1.15 var(--font-d);margin:6px 0 10px;letter-spacing:.01em}

@media (max-width:700px){
  .logo{display:none !important}
  header{padding:10px 12px 0;
    transition:transform .25s ease;
    will-change:transform}
  header.header-hidden{transform:translateY(-100%)}
  .top-row{min-height:auto;margin-bottom:2px;gap:0;flex-direction:column;
    align-items:flex-start;text-align:left}
  .top-row .org{font-size:10px;line-height:1.2;letter-spacing:.08em;
    opacity:.85;text-align:left}
  header h1{font-size:16px;margin:2px 0 6px;line-height:1.1;text-align:left}
  .month-select{font-size:16px;padding:8px 30px 8px 12px;letter-spacing:.08em}
  .nav-bar{padding:2px 0 4px;font-size:11px;min-height:auto}
  .nav-link{padding:3px 8px;font-size:11px}
  .tabs button{font-size:13px;padding:6px 4px}
}
@media (max-height:500px) and (max-width:900px){
  header{padding:6px 12px 0}
  .top-row{display:none}
  header h1{font-size:14px;margin:0 0 4px}
  .month-select{font-size:14px;padding:6px 26px 6px 10px}
  .nav-bar{padding:0 0 3px}
  .tabs button{font-size:12px;padding:5px 4px}
}

.month-select-wrap{position:relative;margin:0 0 10px}
.month-select{
  width:100%;
  appearance:none;-webkit-appearance:none;-moz-appearance:none;
  background:rgba(255,255,255,.22);
  border:2px solid rgba(255,255,255,.45);
  border-radius:8px;
  padding:12px 40px 12px 14px;
  color:#ffffff;
  font:700 22px var(--font-d);
  letter-spacing:.12em;text-transform:uppercase;
  text-align:center;cursor:pointer;
  text-shadow:0 1px 2px rgba(0,0,0,.20);
  box-shadow:0 2px 6px rgba(0,0,0,.10);
  transition:background-color .15s, border-color .15s, box-shadow .15s;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 14 9' fill='white'><path d='M7 9L0 0h14z'/></svg>");
  background-repeat:no-repeat;
  background-position:right 14px center;
  background-size:12px;
}
.month-select:hover{background-color:rgba(255,255,255,.32);border-color:rgba(255,255,255,.7)}
.month-select:focus{outline:0;border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.month-select option{
  color:#000;background:#fff;
  font:500 15px var(--font-b);
  text-transform:none;letter-spacing:0;
}
@media (max-width:420px){
  .month-select{font-size:18px;padding:10px 34px 10px 12px}
}

.nav-bar{display:flex;justify-content:space-between;align-items:center;gap:6px;
  padding:0 0 10px;font:600 13px var(--font-b);min-height:26px}
.nav-link{color:var(--head-fg);text-decoration:none;padding:5px 10px;
  border-radius:5px;background:rgba(255,255,255,.15);opacity:.95;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42%}
.nav-link:hover{background:rgba(255,255,255,.28)}
.nav-link[hidden]{display:none}
.nav-home{flex:none;max-width:none}
.tabs{display:flex;gap:4px}
.tabs button{flex:1;min-width:0;font:600 15px var(--font-d);letter-spacing:.03em;
  text-transform:uppercase;padding:10px 6px;border:0;border-radius:6px 6px 0 0;
  background:transparent;color:var(--head-fg);opacity:.7;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--bg);color:var(--fg);opacity:1}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
section{padding-top:18px;display:flex;flex-direction:column;gap:16px}
label.lbl{font:600 12px var(--font-b);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
select{width:100%;font:500 18px var(--font-b);padding:12px;border:1px solid var(--line);
  border-radius:8px;background:var(--surface);color:var(--fg)}
.who{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;justify-content:space-between}
.who b{font:700 28px/1.1 var(--font-d)}.who span{color:var(--muted)}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow div{font:600 13px var(--font-d);text-align:center;color:var(--muted);
  letter-spacing:.06em;text-transform:uppercase}
.cell{border-radius:6px;min-height:68px;padding:4px 3px 5px;display:flex;
  flex-direction:column;align-items:center;justify-content:space-between;
  text-align:center;color:#000;border:1px solid var(--line);
  transition:box-shadow .15s}
.cell .d{font:500 11px var(--font-b);align-self:flex-start;padding-left:2px;color:#555}
.cell .k{font:700 clamp(14px, 4.6vw, 22px)/1 var(--font-d);
  white-space:nowrap;letter-spacing:-0.01em;max-width:100%;overflow:hidden;
  text-overflow:ellipsis}
.cell.today{outline:4px solid var(--accent);outline-offset:1px;z-index:2}
.cell.nov{opacity:.9}
.cell.code-A{background:#d9a878 !important}
.cell.hl{box-shadow:inset 0 0 0 1000px var(--hl-tint)}
.cell.code-A.hl{background:#d9a878 !important;
                box-shadow:inset 0 0 0 1000px var(--hl-tint)}
.month-sep{grid-column:1/-1;font:700 15px var(--font-d);letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);padding-top:8px}
.cell.blank{background:transparent;border-color:transparent}
.f-w{background:var(--x-w)}.f-g{background:var(--x-g)}.f-G{background:var(--x-G)}
.f-b{background:var(--x-b)}.f-p{background:var(--x-p)}.f-v{background:var(--x-v)}
.f-O{background:var(--x-O)}
.f-V{background:var(--x-V)}.f-FOR{background:var(--x-FOR)}
.stats{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surface);border:1px solid var(--line);display:inline-flex;
  align-items:baseline;gap:6px;padding:6px 10px;border-radius:999px;font:600 14px var(--font-b);
  cursor:pointer;user-select:none;transition:background .12s, border-color .12s}
.chip:hover{background:var(--hl);border-color:var(--hl);color:#fff}
.chip:hover b{color:#fff}
.chip b{font:700 20px var(--font-d)}
.strip{display:flex;gap:4px;overflow-x:auto;padding-bottom:6px}
.strip button{flex:none;width:52px;padding:6px 0;border:1px solid var(--line);
  border-radius:8px;background:var(--surface);color:var(--fg);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;font-family:var(--font-b)}
.strip button small{font:600 11px var(--font-b);color:var(--muted);
  text-transform:uppercase;letter-spacing:.06em}
.strip button b{font:700 22px/1.1 var(--font-d)}
.strip button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.strip button[aria-pressed="true"] small{color:inherit}
.daytitle{font:700 28px/1.1 var(--font-d)}
.grp{border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.grp h3{background:var(--head);color:var(--head-fg);margin:0;padding:8px 12px;
  display:flex;justify-content:space-between;align-items:baseline;
  font:700 19px var(--font-d);letter-spacing:.04em;text-transform:uppercase}
.grp h3 span{font:500 13px var(--font-b);letter-spacing:0;text-transform:none;opacity:.9}
.grp ul{list-style:none;margin:0;padding:0}
.grp li{display:flex;justify-content:space-between;gap:12px;padding:9px 12px;
  border-top:1px solid var(--line);font-size:16px}
.grp li em{font-style:normal;color:var(--muted);font-size:14px;text-align:right}
.grp li button{all:unset;cursor:pointer;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.sec{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.sec h2{font:700 20px var(--font-d);letter-spacing:.08em;text-transform:uppercase;margin:0;color:var(--muted)}
.amp{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.card h3{margin:0;padding:8px 12px;font:700 17px var(--font-d);letter-spacing:.06em;
  text-transform:uppercase;background:var(--head);color:var(--head-fg)}
.card .row{display:flex;align-items:center;gap:10px;padding:8px 12px;
  border-top:1px solid var(--line);font-size:15px}
.card .row:first-of-type{border-top:0}
.card .row i{flex:none;min-width:38px;height:30px;padding-inline:6px;border-radius:5px;
  display:grid;place-items:center;font:700 17px var(--font-d);font-style:normal;
  background:var(--bg);border:1px solid var(--line)}
.card .row i:empty{background:var(--x-g)}
.card .row i.dot{background:var(--x-G)}
.card .row span{flex:1;min-width:0}
.card .row b{font:600 15px var(--font-b);font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{--surface:#fff;--fg:#000;--line:#c4c8c1;--muted:#555;color:var(--fg);
  overflow:auto;border:1px solid var(--line);border-radius:10px;
  background:var(--surface);max-height:80vh}
table.t{border-collapse:separate;border-spacing:0;font-size:13px;width:max-content}
.t th,.t td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  padding:0;text-align:center;white-space:nowrap}
.t thead th{position:sticky;background:var(--surface);z-index:2;font-weight:600}
.t thead tr:nth-child(1) th{top:0;font:700 15px var(--font-d);letter-spacing:.06em;
  text-transform:uppercase;padding:6px 8px;text-align:left}
.t thead tr:nth-child(2) th{top:31px;height:24px;font:700 14px var(--font-d)}
.t thead tr:nth-child(3) th{top:55px;height:20px;font:600 11px var(--font-b);color:var(--muted)}
.t .fix{position:sticky;left:0;z-index:3;background:var(--surface);text-align:left;
  padding:0 10px;min-width:150px;box-shadow:1px 0 0 var(--line)}
.t thead .fix{z-index:4}
.t td.nm{font:600 14px var(--font-b);height:36px}
.t td.nm button{all:unset;cursor:pointer;display:block;width:100%;padding:8px 0}
.t td.nm button:hover{color:var(--accent);text-decoration:underline}
.t td.inf{padding:0 8px;color:var(--muted);font-size:13px}
.t td.sd{padding:0 8px;font:700 15px var(--font-d);font-variant-numeric:tabular-nums}
.t td.cd{min-width:44px;height:36px;font:700 14px var(--font-d);padding:0 3px}
.t td.code-A{background:#d9a878 !important}
.t th.td{
  color:var(--accent);
  box-shadow:inset 3px 0 0 var(--accent),
             inset -3px 0 0 var(--accent),
             inset 0 3px 0 var(--accent);
}
.t th.td2{
  box-shadow:inset 3px 0 0 var(--accent),
             inset -3px 0 0 var(--accent);
}
.t td.tdy{
  box-shadow:inset 3px 0 0 var(--accent),
             inset -3px 0 0 var(--accent);
}
.t td.tdy-end{
  box-shadow:inset 3px 0 0 var(--accent),
             inset -3px 0 0 var(--accent),
             inset 0 -3px 0 var(--accent);
}
.t td.mois{border-right:2px solid var(--fg)}
.hint,.note{font-size:13px;color:var(--muted)}
@media (max-width:420px){
  .tabs button{font-size:13px;padding-inline:2px}
  .cell{min-height:60px}.cell .k{font-size:clamp(12px,4.2vw,18px)}
}

/* ===== Onglet RC / Congés ===== */
.recap-who{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;
  justify-content:space-between}
.recap-who b{font:700 28px/1.1 var(--font-d)}
.recap-who .meta{color:var(--muted);font-size:16px}
.recap-who .meta .mat{font-weight:700;color:var(--accent);
  letter-spacing:.03em}
.recap-duo{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.recap-col-right{display:flex;flex-direction:column;gap:14px}
@media (max-width:640px){.recap-duo{grid-template-columns:1fr}}

.rec-card{background:var(--surface);border:1px solid var(--line);
  border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.rec-card h3{margin:0;padding:12px 16px;font:700 18px var(--font-d);
  letter-spacing:.05em;text-transform:uppercase;color:#fff;
  display:flex;justify-content:space-between;align-items:baseline;
  gap:10px;flex-wrap:wrap}
.rec-card.rc h3{background:#8064a2}
.rec-card.cg h3{background:#4f6228}
.rec-card h3 small{font:500 12px var(--font-b);letter-spacing:0;
  text-transform:none;opacity:.9}

.rec-card.droit{background:linear-gradient(to right,
  rgba(79,98,40,.10),rgba(79,98,40,.03));border-color:rgba(79,98,40,.4)}
.rec-card.droit .row{display:flex;justify-content:space-between;
  align-items:baseline;padding:14px 16px;gap:10px;flex-wrap:wrap}
.rec-card.droit .k{font:700 14px var(--font-b);color:#4f6228;
  letter-spacing:.03em;text-transform:uppercase}
.rec-card.droit .v{font:700 24px var(--font-d);color:#4f6228;
  font-variant-numeric:tabular-nums;line-height:1}

.rec-lines{display:flex;flex-direction:column}
.rec-line{display:flex;justify-content:space-between;align-items:flex-start;
  padding:9px 16px;border-top:1px solid var(--line);font-size:14px;
  gap:8px;background:var(--surface)}
.rec-line:first-child{border-top:0}
.rec-line .k{color:var(--muted);display:flex;flex-direction:column;gap:2px}
.rec-line .k .sub{font-size:11px;font-style:italic;
  color:rgba(93,107,123,.85);font-weight:400}
.rec-line .v{font:700 17px var(--font-d);font-variant-numeric:tabular-nums;
  flex:none}

.rec-line.key{align-items:baseline}
.rec-line.key .k{color:var(--fg);font-weight:600;font-style:normal}
.rec-line.key .v{font-size:24px;font-weight:700}

.rec-line.key.blue{background:rgba(46,111,174,.06);
  border-top:2px solid rgba(46,111,174,.25)}
.rec-line.key.blue .v{color:var(--accent)}
.rec-line.key.orange{background:rgba(199,125,30,.08);
  border-top:2px solid rgba(199,125,30,.30)}
.rec-line.key.orange .k{color:#8a5410}
.rec-line.key.orange .v{color:#c77d1e}
.rec-line.key.green{background:rgba(61,139,61,.07);
  border-top:2px solid rgba(61,139,61,.28)}
.rec-line.key.green .k{color:#2b632b}
.rec-line.key.green .v{color:#3d8b3d}

.rec-line.sub{background:var(--surface)}
.rec-line.sub.first{border-top:2px solid var(--line)}
.rec-line.sub.last{border-bottom:2px solid var(--line)}
</style></head><body>
<div class="wrap">
<header id="mainHeader">
  <div class="top-row">
    <img id="logoImg" class="logo" alt="Logo" hidden>
    <div class="org" id="orgline"></div>

    <select id="monthSelect" class="month-select" aria-label="Choisir un mois">

  </div>
  <nav class="nav-bar" id="navbar">
    <a id="navprev" class="nav-link" hidden></a>
    <a href="tous-les-mois.html" class="nav-link nav-home">📅 Tous les mois</a>

</div>

  if(c==='R')  return {t:'R',k:'R',l:'Repos',p:'',h:''};
  if(c==='/')  return {t:'N',k:'/',l:'Suite de nuit (travail)',p:'',h:''};
  if(c==='RC') return {t:'RC',k:'RC',l:'Repos compensatoire',p:'',h:''};
  if(c==='C')  return {t:'C',k:'C',l:'Congé',p:'',h:''};
  if(c==='F')  return {t:'F',k:'F',l:'Jour férié',p:'',h:''};
  if(c==='D')  return {t:'D',k:'D',l:'D (à préciser)',p:'',h:''};
  if(c==='=')  return {t:'J',k:'=',l:'Journée',p:'',h:''};
  if(c==='=PC')return {t:'J',k:'=PC',l:'Journée PC',p:'PC',h:'07h – 15h'};
  if(c==='Ret')return {t:'B',k:'',l:'Bureau retard',p:'Ret',h:''};
  if(c==='Rap')return {t:'B',k:'',l:'Bureau rapport',p:'Rap',h:''};
  if(c==='Ral')return {t:'B',k:'',l:'Bureau ralentissement',p:'Ral',h:''};
  if(c==='A')   return {t:'A',k:'A',l:'Absent',p:'',h:''};
  if(c==='Cexp')return {t:'Cexp',k:'Cexp',l:'Congé exceptionnel',p:'',h:'',f:'O'};
  if(c==='M')   return {t:'Mal',k:'M',l:'Maladie',p:'',h:'',f:'O'};
  if(c==='V')   return {t:'V',k:'V',l:'Visite médicale',p:'',h:'',f:'V'};
  if(c==='FOR') return {t:'FOR',k:'FOR',l:'Formation',p:'',h:'',f:'FOR'};
  let m=c.match(/^([+-])(.+)$/);
  if(m){const t=m[1]==='-'?'M':'S';return {t,k:t,l:t==='M'?'Matinée':'Soirée',p:sp(m[2]),h:HRS[t]};}
  m=c.match(/^(?:R\/)?N(?:\s+(.+))?$/);
  if(m){
    const isRepos = c.startsWith('R/');
    return {
      t: isRepos ? 'R' : 'N',
      k: c,
      l: isRepos ? 'Repos (avant nuit)' : 'Nuit',
      p: m[1] ? sp(m[1]) : '',
      h: isRepos ? '' : HRS.N
    };
  }
  return {t:'X',k:c,l:c,p:'',h:''};
}

(function(){
  const selfId = (CFG.monthName + CFG.year).toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .replace(/[^a-z0-9]/g,'');

  const selMois = document.getElementById('monthSelect');
  selMois.innerHTML = '<option>' + cap(CFG.monthName) + ' ' + CFG.year + '</option>';

  fetch('mois.json', {cache: 'no-store'})
    .then(r => r.ok ? r.json() : null)
    .then(data => {
      if (!data || !Array.isArray(data.months) || data.months.length === 0) return;
      const sorted = data.months.slice().sort((a,b) =>
        (a.year - b.year) || (a.monthNum - b.monthNum));
      selMois.innerHTML = '';
      sorted.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m.file;
        opt.textContent = m.label;
        if (m.id === selfId) opt.selected = true;
        selMois.appendChild(opt);
      });
      selMois.addEventListener('change', () => {
        if (selMois.value) window.location.href = selMois.value;
      });
      const idx = data.months.findIndex(m => m.id === selfId);
      if (idx >= 0) {
        const p = data.months[idx - 1];
        const n = data.months[idx + 1];
        if (p) {
          const a = document.getElementById('navprev');
          a.href = p.file; a.textContent = '← ' + p.label; a.hidden = false;
        }
        if (n) {
          const a = document.getElementById('navnext');
          a.href = n.file; a.textContent = n.label + ' →'; a.hidden = false;
        }
      }
    })
    .catch(() => {});
})();

const RECAP_BY_SLUG = {};

  RECAP.forEach(r => { RECAP_BY_SLUG[slug(r.n)] = r; });

function recLineHTML(label, v, opts){
  opts = opts || {};
  const cls = [];
  if (opts.key)    cls.push('key');
  if (opts.blue)   cls.push('blue');
  if (opts.orange) cls.push('orange');
  if (opts.green)  cls.push('green');
  if (opts.sub)    cls.push('sub');
  if (opts.first)  cls.push('first');
  if (opts.last)   cls.push('last');
  const subTxt = opts.subtitle
    ? '<span class="sub">(' + opts.subtitle + ')</span>' : '';
  const vStr = (v === null || v === undefined)
    ? '<span style="color:var(--muted);font-weight:500">—</span>' : v;
  return `<div class="rec-line${cls.length ? ' ' + cls.join(' ') : ''}">
    <span class="k">${label}${subTxt}</span>
    <span class="v">${vStr}</span>
  </div>`;
}

function rcCardRecap(d){
  const label = d.pris + ' pris · ' + d.report + ' à reporter';
  const html =
      recLineHTML('Reliquat au 1er du mois', d.reliquat, {key:true, blue:true})
    + recLineHTML('Double Service', d.double, {sub:true, first:true})
    + recLineHTML("Dépassement d'amplitude", d.depl, {sub:true})
    + recLineHTML('AÏD', d.aid, {sub:true})
    + recLineHTML('Exceptionnel', d.except, {sub:true, last:true,
        subtitle:'Suite détachement pendant un jour de repos'})
    + recLineHTML('Repos Compensatoires validés', d.valides, {key:true, blue:true})
    + recLineHTML('Pris ce mois', d.pris, {key:true, orange:true})
    + recLineHTML('À reporter',   d.report, {key:true, green:true});
  return `<div class="rec-card rc">
    <h3>Repos Compensatoires (RC)<small>${label}</small></h3>
    <div class="rec-lines">${html}</div>
  </div>`;
}

function drawRecap(){
  const nameEl = $('rec-name');
  const metaEl = $('rec-meta');
  const container = $('rec-content');

  if (sel.value === '' || AG[+sel.value] === undefined) {
    nameEl.textContent = 'Choisissez un agent dans « Mon planning »';
    metaEl.textContent = '';
    container.innerHTML =
      '<p class="note">Sélectionnez d\'abord votre nom dans l\'onglet ' +
      '<b>Mon planning</b>, puis revenez ici.</p>';
    return;
  }

  const a = AG[+sel.value];
  nameEl.textContent = a.n;
  metaEl.innerHTML = `<span class="mat">${a.m}</span>`;

  const rec = RECAP_BY_SLUG[slug(a.n)];
  if (!rec) {
    container.innerHTML =
      '<p class="note">Aucune donnée RC / Congés disponible pour cet agent.</p>';
    return;
  }

  container.innerHTML =
    '<div class="recap-duo">' +
      '<div>' + rcCardRecap(rec.rc) + '</div>' +
      '<div class="recap-col-right">' +
        droitCardRecap(rec.conge.autorises) +
        cgCardRecap(rec.conge) +
      '</div>' +
    '</div>';
}

    +' · Solde Cgé au 1er '+cap(CFG.monthName)+' '+CFG.year+' : '+a.s;
  const grid=$('grid'); grid.innerHTML='';
  const cnt={};
  const off=(dateOf(0).getDay()+6)%7;
  for(let i=0;i<off;i++) grid.insertAdjacentHTML('beforeend','<div class="cell blank"></div>');

    const d=dateOf(i), x=parse(raw, a.p);

      grid.insertAdjacentHTML('beforeend','<div class="month-sep">Début '+cap(CFG.nextMonthName)+'</div>');

    +'<span class="note" style="align-self:center">sur '+CFG.monthName+' '+CFG.year+'</span>';

    chip.addEventListener('mouseleave', off);

// ---- Header rétractable au scroll (mobile uniquement) ----
(function(){
  const header = document.getElementById('mainHeader');
  if (!header) return;
  let lastY = window.scrollY || 0;
  let ticking = false;
  const THRESHOLD = 6;
  const TOP_ZONE  = 40;
  const isMobile  = () => window.innerWidth <= 700;

  function updateHeader(){
    if (!isMobile()) {
      header.classList.remove('header-hidden');
      ticking = false;
      return;
    }
    const currentY = window.scrollY;
    const delta = currentY - lastY;

    if (currentY <= TOP_ZONE) {
      header.classList.remove('header-hidden');
    } else if (delta > THRESHOLD) {
      header.classList.add('header-hidden');
    } else if (delta < -THRESHOLD) {
      header.classList.remove('header-hidden');
    }
    lastY = currentY;
    ticking = false;
  }

  window.addEventListener('scroll', () => {
    if (!ticking) {
      window.requestAnimationFrame(updateHeader);
      ticking = true;
    }
  }, {passive: true});

  window.addEventListener('resize', () => {
    if (!isMobile()) header.classList.remove('header-hidden');
  });
})();
