<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pointages SNCFT — Tous les mois</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#eef2f7;--surface:#fff;--fg:#16222f;--muted:#5d6b7b;
  --line:#d3dbe6;--head:#3579bd;--head-fg:#fff;--accent:#2e6fae;
  --font-d:'Barlow Condensed','Arial Narrow',sans-serif;
  --font-b:'IBM Plex Sans',system-ui,sans-serif;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 var(--font-b)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 40px}
header{background:var(--head);color:var(--head-fg);margin-inline:-16px;
  padding:24px 16px 20px;text-align:center}
header .org{font:600 11px/1.3 var(--font-b);letter-spacing:.1em;
  text-transform:uppercase;opacity:.85}
header h1{font:700 26px/1.1 var(--font-d);margin:6px 0 4px;letter-spacing:.01em}
header p{margin:6px 0 0;font-size:14px;opacity:.9}
.list{display:grid;gap:8px;margin-top:20px}
.mois-card{display:flex;justify-content:space-between;align-items:center;
  padding:16px 20px;background:var(--surface);border:1px solid var(--line);
  border-radius:10px;text-decoration:none;color:var(--fg);
  transition:transform .1s,box-shadow .1s,border-color .1s}
.mois-card:hover{transform:translateY(-1px);
  box-shadow:0 4px 12px rgba(46,111,174,.15);border-color:var(--accent)}
.mois-nom{font-family:var(--font-d);font-size:22px;letter-spacing:.02em;font-weight:600}
.mois-fleche{color:var(--accent);font-size:22px}
.vide{text-align:center;color:var(--muted);padding:30px}
.footer{text-align:center;color:var(--muted);font-size:12px;
  margin-top:30px;font-style:italic}
</style></head><body>
<div class="wrap">
<header>
  <div class="org">Société nationale des chemins de fer tunisiens<br>
    Département Gestion des circulations ferroviaires</div>
  <h1>Pointage du personnel du PC et de la Régulation</h1>
  <p>Consultez le pointage d'un mois en particulier</p>
</header>
<div class="list">
<a class="mois-card" href="indexoctobre2026.html"><span class="mois-nom">Octobre 2026</span><span class="mois-fleche">→</span></a>
<a class="mois-card" href="indexjanvier2026.html"><span class="mois-nom">Janvier 2026</span><span class="mois-fleche">→</span></a>
</div>
<p class="footer">Dernière mise à jour : 2026-10-06T16:50:35</p>
</div>
</body></html>
